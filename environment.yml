# Code Generated by Sidekick is for learning and experimentation purposes only.
name: dm4ml
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip
  - jupyterlab
  - notebook
  - ipykernel

  # Core data stack
  - pandas
  - numpy
  - scipy
  - scikit-learn
  - pyarrow
  - fastparquet

  # Visualization / EDA
  - matplotlib
  - seaborn

  # File / API handling
  - requests
  - pyyaml
  - tqdm

  # Reporting
  - reportlab

  # Optional but useful
  - openpyxl
  - python-dotenv

  - pip:
      # Orchestration
      - prefect

      # Experiment tracking / versioning
      - mlflow
      - dvc
      - papermill
      - kagglehub

      # Nice-to-have for notebook stability
      - nbformat
      - nbclient



# run these
# conda env create -f environment.yml
# conda activate dm4ml
# python -m ipykernel install --user --name dm4ml --display-name "Python (dm4ml)"
# python -m pip install mlflow
# python -m pip install mlflow ipykernel
# python -m ipykernel install --user --name dm4ml --display-name "Python (dm4ml)"