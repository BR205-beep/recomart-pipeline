# Code Generated by Sidekick is for learning and experimentation purposes only.
name: dm4ml
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip
  - jupyterlab
  - notebook
  - ipykernel

  # Core data stack
  - pandas=2.2.*
  - numpy=1.26.*
  - scipy=1.13.*
  - scikit-learn=1.5.*
  - pyarrow=16.*
  - fastparquet

  # Visualization / EDA
  - matplotlib=3.8.*
  - seaborn=0.13.*

  # File / API handling
  - requests=2.32.*
  - pyyaml=6.0.*
  - tqdm=4.66.*

  # Reporting
  - reportlab=4.2.*

  # Optional but useful
  - openpyxl=3.1.*
  - python-dotenv=1.0.*

  - pip:
      # Orchestration
      - prefect==2.19.5

      # Experiment tracking / versioning
      - mlflow==2.14.3
      - dvc==3.51.2

      # Nice-to-have for notebook stability
      - nbformat==5.10.4
      - nbclient==0.10.0



# run these
# conda env create -f environment.yml
# conda activate dm4ml
# python -m ipykernel install --user --name dm4ml --display-name "Python (dm4ml)"
# python -m pip install mlflow
# python -m pip install mlflow ipykernel
# python -m ipykernel install --user --name dm4ml --display-name "Python (dm4ml)"